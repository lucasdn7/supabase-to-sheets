name: Deploy Webhook Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Verificar variáveis de ambiente obrigatórias
        id: check-secrets
        run: |
          echo "Verificando secrets..."
          missing=()

          for var_name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY GOOGLE_SPREADSHEET_ID GOOGLE_SERVICE_ACCOUNT_JSON; do
            if [ -z "${!var_name}" ]; then
              missing+=("$var_name")
            fi
          done

          if [ ${#missing[@]} -gt 0 ]; then
            echo "⚠️ Secrets ausentes: ${missing[*]}"
            echo "⚠️ Configure os valores em: Settings → Secrets and variables → Actions."
            echo "can_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "✅ Todos os secrets estão presentes."
          echo "can_deploy=true" >> "$GITHUB_OUTPUT"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || vars.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID || vars.GOOGLE_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON || vars.GOOGLE_SERVICE_ACCOUNT_JSON }}

      # ── Descomente o bloco abaixo se usar Railway, Render ou Fly.io ──────────
