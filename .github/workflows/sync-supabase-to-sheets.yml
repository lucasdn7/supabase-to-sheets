name: Sync Supabase to Sheets

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  schedule:
    # A cada 5 minutos (menor intervalo suportado no GitHub Actions)
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: sync-supabase-to-sheets
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Validar variáveis obrigatórias
        id: check-vars
        run: |
          echo "Verificando secrets/variables..."
          missing=()

          for var_name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY GOOGLE_SPREADSHEET_ID GOOGLE_SERVICE_ACCOUNT_JSON GOOGLE_SHEET_NAME; do
            if [ -z "${!var_name}" ]; then
              missing+=("$var_name")
            fi
          done

          if [ ${#missing[@]} -gt 0 ]; then
            echo "⚠️ Variáveis ausentes: ${missing[*]}"
            echo "⚠️ Configure em Settings → Secrets and variables → Actions."
            echo "can_sync=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "✅ Variáveis obrigatórias OK."
          echo "can_sync=true" >> "$GITHUB_OUTPUT"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || vars.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID || vars.GOOGLE_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON || vars.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_NAME: ${{ secrets.GOOGLE_SHEET_NAME || vars.GOOGLE_SHEET_NAME }}

      - name: Sincronizar processos para Google Sheets
        if: steps.check-vars.outputs.can_sync == 'true'
        run: npm run sync:all
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || vars.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID || vars.GOOGLE_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON || vars.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_NAME: ${{ secrets.GOOGLE_SHEET_NAME || vars.GOOGLE_SHEET_NAME }}
